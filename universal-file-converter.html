const mn=a=>a.reduce((m,v)=>v<m?v:m,Infinity),mx=a=>a.reduce((m,v)=>v>m?v:m,-Infinity);

function dxfSVG(G){const B=dxfB(G),pad=Math.max(B.w,B.h)*.04,vw=B.w+2*pad,vh=B.h+2*pad,sw=Math.max(B.w,B.h)/1000,vx=B.x0-pad,vy=-(B.y0+B.h)-pad;
const pl=G.ln.map(l=>`<${l.closed?'polygon':'polyline'} points="${l.pts.map(q=>q[0].toFixed(3)+','+(-q[1]).toFixed(3)).join(' ')}"/>`).join('');
const tx=G.texts.map(t=>`<text x="${t.x}" y="${-t.y}" font-size="${t.h}" font-family="sans-serif" fill="#111" stroke="none">${esc(t.s)}</text>`).join('');
return`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="${Math.round(1600*vh/vw)}" viewBox="${vx} ${vy} ${vw} ${vh}"><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#fff"/><g fill="none" stroke="#111" stroke-width="${sw}" stroke-linejoin="round">${pl}</g>${tx}</svg>`}
function pdfVector(c,W,H){const enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let len=0;const push=b=>{parts.push(b);len+=b.length};push(enc('%PDF-1.4\n'));const obj=(n,b)=>{offs[n]=len;push(enc(n+' 0 obj\n'+b+'\nendobj\n'))};
obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 4 0 R>>>>/Contents 5 0 R>>`);obj(4,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>');
const by=enc(c);offs[5]=len;push(enc(`5 0 obj\n<</Length ${by.length}>>\nstream\n`));push(by);push(enc('\nendstream\nendobj\n'));
const x=len;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';t+=`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;push(enc(t));return new Blob(parts,{type:'application/pdf'})}
function dxfPDF(G){const B=dxfB(G),land=B.w>=B.h,W=land?842:595,H=land?595:842,m=24,s=Math.min((W-2*m)/B.w,(H-2*m)/B.h),ox=(W-B.w*s)/2,oy=(H-B.h*s)/2,X=x=>((x-B.x0)*s+ox).toFixed(2),Y=y=>((y-B.y0)*s+oy).toFixed(2);
let c='0.4 w 0 0 0 RG\n';G.ln.forEach(l=>{c+=l.pts.map((q,i)=>X(q[0])+' '+Y(q[1])+(i?' l':' m')).join('\n')+(l.closed?'\nh S\n':'\nS\n')});
G.texts.forEach(t=>{const a=t.s.replace(/[^\x20-\x7e]/g,'').replace(/([\\()])/g,'\\$1');c+=`BT /F1 ${Math.max(t.h*s,2).toFixed(2)} Tf ${X(t.x)} ${Y(t.y)} Td (${a}) Tj ET\n`});return pdfVector(c,W,H)}
async function remote(f,from,to){if(!S.engine)throw new Error('Set the engine URL on the Formats and engines page. DWG needs a running engine server.');let r;try{r=await fetch(S.engine+'/convert?from='+from+'&to='+to,{method:'POST',body:f})}catch(e){throw new Error('Could not reach the engine at '+S.engine+'. Pages hosted on claude.ai block outside requests; open the downloaded page file instead.')}
if(!r.ok)throw new Error('Engine error: '+(await r.text()).slice(0,200));return r.blob()}
Object.assign(CONV,{dxf2svg:async f=>new Blob([dxfSVG(dxfGeo(await f.text()))],{type:'image/svg+xml'}),dxf2pdf:async f=>dxfPDF(dxfGeo(await f.text())),
async dxf2png(f){const u=URL.createObjectURL(new Blob([dxfSVG(dxfGeo(await f.text()))],{type:'image/svg+xml'}));try{const i=await loadImg(u),c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);return toBlob(c,'image/png')}finally{URL.revokeObjectURL(u)}},
remote:(f,r)=>remote(f,r.f,r.t),async dwg2svg(f){return CONV.dxf2svg(await remote(f,'dwg','dxf'))},async dwg2pdf(f){return CONV.dxf2pdf(await remote(f,'dwg','dxf'))}});
const SIG={png:'png',jpg:'jpg',webp:'webp',pdf:'pdf',dwg:'dwg'};
async function convert(id){const rec=recs.find(r=>r.id===id),f=blobs.get(id);if(!rec||!f||!rec.to)return;const reg=REG.find(r=>r.f===rec.ext&&r.t===rec.to);
rec.status='processing';rec.msg='';render();const t0=performance.now();
try{if(!reg||!reg.mode)throw new Error('No conversion engine is connected for '+rec.ext.toUpperCase()+' → '+rec.to.toUpperCase()+'.');
NOTE='';const out=await CONV[reg.mode](f,reg);if(!out||!out.size)throw new Error('The engine produced an empty file.');
if(SIG[rec.to]){const d=await detect(out);if(d!==SIG[rec.to])throw new Error('Output validation failed: file signature is '+d+'.')}
if(rec.to==='dxf'&&!(await out.text()).includes('SECTION'))throw new Error('Output validation failed: not a DXF file.');if(rec.to==='svg'&&!(await out.text()).includes('<svg'))throw new Error('Output validation failed: not an SVG file.');
outs.set(id,out);rec.status='done';rec.outSize=out.size;rec.msg=[reg.note,NOTE].filter(Boolean).join(' ')}catch(e){rec.status='failed';rec.msg=e.message}
rec.ms=Math.round(performance.now()-t0);rec.ts=Date.now();save();render()}
async function addFiles(list){for(const f of list){const e=ext(f.name);const rec={id:'f'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,ext:e,cat:CAT[e]||'Other',size:f.size,ts:Date.now(),status:'ready',to:'',ms:0,msg:''};
if(f.size>MAX){rec.status='failed';rec.msg='Larger than the 100 MB limit.'}else if(f.size===0){rec.status='failed';rec.msg='The file is empty.'}
else{const d=await detect(f);rec.det=d;const ok={jpg:'jpg',png:'png',webp:'webp',gif:'gif',bmp:'bmp',pdf:'pdf',tiff:'tiff',dwg:'dwg'};if(ok[d]&&ok[d]!==e&&!(d==='zip'))rec.msg='Content looks like '+d.toUpperCase()+', not '+e.toUpperCase()+'. Treating it as '+d.toUpperCase()+'.';if(ok[d]&&ok[d]!==e){rec.ext=ok[d];rec.cat=CAT[rec.ext]||'Other'}
if(d==='dwg'){const v=await f.slice(0,6).text();rec.msg='DWG version '+(({AC1015:'2000',AC1018:'2004',AC1021:'2007',AC1024:'2010',AC1027:'2013',AC1032:'2018'})[v]||v)+'.'}
if(['zip','binary'].includes(d)&&!CAT[e])rec.msg='Unknown format.';blobs.set(rec.id,f);
const t=targets(rec.ext);if(t.length)rec.to=(t.find(x=>x.mode)||t[0]).t}
recs.push(rec)}save();go('conv')}
// Views
const stat=(s)=>`<span class="${s}">${s}</span>`;
const stats=()=>({total:recs.length,done:recs.filter(r=>r.status==='done').length,proc:recs.filter(r=>r.status==='processing').length,fail:recs.filter(r=>r.status==='failed').length,store:recs.reduce((a,r)=>a+r.size,0),ms:recs.reduce((a,r)=>a+(r.ms||0),0)});
const bars=(m,title)=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=Math.max(1,...e.map(x=>x[1]));return`<div class="card"><h3>${title}</h3>${e.length?e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*100}%"></i><em>${v}</em></div>`).join(''):'<div class="empty">No data yet.</div>'}</div>`};
function dash(){const s=stats(),dn=recs.filter(r=>r.status==='done');const cat={},pair={},day={};
dn.forEach(r=>{cat[r.cat]=(cat[r.cat]||0)+1;const p=r.ext.toUpperCase()+' → '+r.to.toUpperCase();pair[p]=(pair[p]||0)+1});
for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);day[d.toLocaleDateString(undefined,{weekday:'short'})]=0}
dn.forEach(r=>{const k=new Date(r.ts).toLocaleDateString(undefined,{weekday:'short'});if(k in day&&Date.now()-r.ts<7*864e5)day[k]++});
const k=(n,l,f)=>`<button class="kpi" data-f="${f}"><b>${n}</b><span>${l}</span></button>`;
return`<h2>Dashboard</h2><p class="sub">Every number here is computed from files you have uploaded and converted. History is kept in this browser only.</p>
<div class="row" style="margin-bottom:16px"><button class="btn p" data-v="conv">Convert files</button><button class="btn" id="up">Upload files</button></div>
<div class="kpis">${k(s.total,'Files uploaded','')}${k(s.done,'Successful conversions','done')}${k(s.proc,'Processing now','processing')}${k(s.fail,'Failed conversions','failed')}${k(fmt(s.store),'Storage used (originals)','')}${k((s.ms/1000).toFixed(1)+' s','Total processing time','')}</div>
<div class="grid2">${bars(day,'Conversions, last 7 days')}${bars(cat,'Volume by category')}${bars(pair,'Most used conversions')}${bars({Successful:s.done,Failed:s.fail},'Successful vs failed')}</div>
<h3>Recent files</h3>${table(recs.slice(-5).reverse())}`}
function table(list){if(!list.length)return`<div class="card empty">No files yet. Upload a file to start converting.</div>`;
return`<div class="wrap card"><table><tr><th>File</th><th>From → to</th><th>Size</th><th>Date</th><th>Status</th><th></th></tr>${list.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="tag">${esc(r.ext)}</span> → <span class="tag">${esc(r.to||'?')}</span></td><td>${fmt(r.size)}</td><td>${new Date(r.ts).toLocaleString()}</td><td>${stat(r.status)}${r.status==='failed'?`<div class="note f">${esc(r.msg)}</div>`:''}</td><td>${outs.has(r.id)?`<button class="btn" data-dl="${r.id}">Download</button>`:r.status==='done'?'<span class="note">Re-upload to download</span>':''}</td></tr>`).join('')}</table></div>`}
function conv(){const pend=recs.filter(r=>r.status==='ready').length;
return`<h2>Convert files</h2><p class="sub">Drop files here. The file type is read from the file’s own bytes, then you pick a target. Formats marked “needs engine” cannot run in a browser.</p>
<div class="drop" id="drop" tabindex="0" role="button">Drop files here or click to choose them<br><small class="note">Up to 100 MB each. Files stay in your browser.</small></div>
<div class="card" style="margin:14px 0"><div class="row"><label>Image and PDF quality <input type="range" id="q" min="10" max="100" value="${S.opts.quality*100}"> <span id="qv">${Math.round(S.opts.quality*100)}%</span></label><label>Image scale <select id="sc">${[25,50,75,100,150,200].map(v=>`<option ${v===S.opts.scale?'selected':''}>${v}</option>`).join('')}</select>%</label><span class="sp" style="flex:1"></span><button class="btn p" id="all" ${pend?'':'disabled'}>Convert all (${pend})</button></div></div>
<div class="card">${recs.length?recs.slice().reverse().filter(r=>blobs.has(r.id)||r.status==='failed').slice(0,30).map(item).join('')||'<div class="empty">Files from earlier sessions are in the library.</div>':'<div class="empty">Nothing queued. Add a file to see the formats it can become.</div>'}</div>`}
function item(r){const t=targets(r.ext),sel=REG.find(x=>x.f===r.ext&&x.t===r.to);
const opts=t.map(x=>`<option value="${x.t}" ${x.t===r.to?'selected':''}>${x.t.toUpperCase()}${avail(x)?'':' (needs engine)'}</option>`).join('');
let note=r.msg?`<div class="note ${r.status==='failed'?'f':'w'}">${esc(r.msg)}</div>`:'';
if(r.status==='ready'&&sel&&!avail(sel))note=`<div class="note f">Needs: ${esc(sel.eng)}. ${esc(sel.note)}${sel.remote&&!S.engine?' Set the engine URL on the Formats and engines page.':' Not connected in this build.'}</div>`;else if(r.status==='ready'&&sel&&sel.note)note=`<div class="note w">${esc(sel.note)}</div>`;
if(!t.length&&r.status==='ready')note=`<div class="note f">No conversions are registered for .${esc(r.ext)} files.</div>`;
return`<div class="item"><div><b>${esc(r.name)}</b> <span class="tag">${esc(r.ext)}</span> ${fmt(r.size)} ${stat(r.status)}${r.status==='done'?` <span class="note">→ ${fmt(r.outSize)} in ${r.ms} ms</span>`:''}</div>
<div class="row">${r.status==='ready'||r.status==='failed'&&blobs.has(r.id)?`<select data-t="${r.id}">${opts}</select><button class="btn p" data-c="${r.id}" ${sel&&avail(sel)?'':'disabled'}>Convert</button>`:''}${outs.has(r.id)?`<button class="btn p" data-dl="${r.id}">Download</button>`:''}</div>${note}</div>`}
function lib(){let l=recs.slice().reverse();const q=S.q.toLowerCase();
if(S.st)l=l.filter(r=>r.status===S.st);if(q)l=l.filter(r=>[r.name,r.ext,r.to,r.cat,r.status,new Date(r.ts).toLocaleDateString()].join(' ').toLowerCase().includes(q));
const pages=Math.max(1,Math.ceil(l.length/10));S.page=Math.min(S.page,pages-1);
return`<h2>File library</h2><p class="sub">Search by name, extension, category, date or status.</p><div class="row" style="margin-bottom:12px"><input type="search" id="sq" placeholder="Search files" value="${esc(S.q)}"><select id="sf"><option value="">All statuses</option>${['ready','processing','done','failed'].map(s=>`<option ${S.st===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" id="clr">Clear history</button></div>${table(l.slice(S.page*10,S.page*10+10))}
<div class="row" style="margin-top:10px"><button class="btn" data-pg="-1" ${S.page?'':'disabled'}>Previous</button><span>Page ${S.page+1} of ${pages}</span><button class="btn" data-pg="1" ${S.page<pages-1?'':'disabled'}>Next</button></div>`}
function reg(){const g={};REG.forEach(r=>(g[r.f]=g[r.f]||[]).push(r));
return`<h2>Formats and engines</h2><p class="sub">The registry lists every supported pair and what it needs. Browser pairs work now. Others need a server worker or a licensed engine, and are never reported as converted until a real output exists. For CAD and BIM, generic 3D conversion does not keep Revit families, parameters or element relationships, and scanned PDF to DWG needs manual cleanup.</p>
<div class="card row" style="margin-bottom:12px"><label>DWG engine server <input type="text" id="eng" value="${esc(S.engine)}" placeholder="http://localhost:8787" size="30"></label><span class="note">Needed for DWG and for DXF to DWG. Run engine-server.js on your machine. Pages on claude.ai cannot reach outside servers, so open the downloaded page file to use it.</span></div><div class="wrap card"><table><tr><th>From</th><th>To</th><th>Engine</th><th>Status</th><th>Limitations</th></tr>${REG.map(r=>`<tr><td>${r.f.toUpperCase()}</td><td>${r.t.toUpperCase()}</td><td>${esc(r.eng)}</td><td>${avail(r)?'<span class="done">available</span>':'<span class="processing">needs engine'+(r.remote?' server':'')+'</span>'}</td><td>${esc(r.note)}</td></tr>`).join('')}</table></div>
<p class="note">Not yet in the registry: DOC, RTF, ODT, EPUB, ODS, XLS, PPT, ODP, ICO, DWF, RFA, RTE, SKP, STEP, IGES, FBX, 3DM, MOV, AVI, FLAC, AAC.</p>`}
const V={dash,conv,lib,reg};
function render(){const y=window.scrollY;$('#app').innerHTML=V[S.v]();document.querySelectorAll('nav [data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.v));
const d=$('#drop');if(d){const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.onchange=()=>addFiles(inp.files);d.onclick=()=>inp.click();d.onkeydown=e=>e.key==='Enter'&&inp.click();
d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}}
window.scrollTo(0,y)}
function go(v,f){S.v=v;S.page=0;if(f!==undefined)S.st=f;render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-f],[data-c],[data-dl],[data-pg],#up,#all,#clr,#theme');if(!t)return;
if(t.dataset.f!==undefined)return go('lib',t.dataset.f);if(t.dataset.v)return go(t.dataset.v,'');
if(t.id==='up'){const i=document.createElement('input');i.type='file';i.multiple=true;i.onchange=()=>addFiles(i.files);i.click()}
if(t.dataset.c)convert(t.dataset.c);if(t.id==='all')recs.filter(r=>r.status==='ready'&&REG.find(x=>x.f===r.ext&&x.t===r.to&&avail(x))).reduce((p,r)=>p.then(()=>convert(r.id)),Promise.resolve());
if(t.dataset.dl){const o=outs.get(t.dataset.dl),r=recs.find(x=>x.id===t.dataset.dl),a=document.createElement('a');a.href=URL.createObjectURL(o);a.download=r.name.replace(/\.[^.]+$/,'')+'.'+r.to;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
if(t.dataset.pg){S.page+=+t.dataset.pg;render()}
if(t.id==='clr'){recs=[];blobs.clear();outs.clear();save();render()}
if(t.id==='theme'){const r=document.documentElement,dk=matchMedia('(prefers-color-scheme:dark)').matches,cur=r.dataset.theme||(dk?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='eng'){S.engine=t.value.trim().replace(/\/$/,'');try{localStorage.setItem('ufc_engine',S.engine)}catch(x){}render()}if(t.dataset.t){recs.find(r=>r.id===t.dataset.t).to=t.value;save();render()}if(t.id==='sf'){S.st=t.value;S.page=0;render()}if(t.id==='sc')S.opts.scale=+t.value});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.opts.quality=e.target.value/100;$('#qv').textContent=e.target.value+'%'}if(e.target.id==='sq'){S.q=e.target.value;S.page=0;const p=e.target.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(p,p)}});
recs.forEach(r=>{if(r.status==='processing')r.status='failed',r.msg='Interrupted by a page reload.'});
render();
</script>
